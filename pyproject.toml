[project]
name = "join-eos-exif"
version = "0.0.0"
description = "Join EOS files to images using EXIF data"
authors = [{ name = "Taylor Denouden", email = "taylor.denouden@hakai.org" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyqt6>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.5.7",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "zizmor>=1.31.1",
]
