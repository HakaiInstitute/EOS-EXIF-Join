name: Create Release

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'

permissions: {}

jobs:
  build-binaries:
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Build Windows GUI Executable
        if: ${{ runner.os == 'Windows' }}
        run: >
          uv run pyinstaller
          --onefile
          --windowed
          --icon='gui\resources\logo.ico'
          --add-data='gui\resources\*.ico;resources'
          --add-data="gui\resources\*.ui;resources"
          --name="EOS-EXIF-Join-${GITHUB_REF_NAME}-win64"
          gui/__main__.py

      - name: Build Linux GUI Executable
        if: ${{ runner.os == 'Linux' }}
        run: >
          uv run pyinstaller
          --onefile
          --windowed
          --icon='gui/resources/logo.ico'
          --add-data='gui/resources/*.ico:resources'
          --add-data="gui/resources/*.ui:resources"
          --name="EOS-EXIF-Join-${GITHUB_REF_NAME}-linux"
          gui/__main__.py

      - name: Archive release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-dist
          path: dist

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-latest-dist
          path: win64-dist

      - name: Download Ubuntu artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubuntu-latest-dist
          path: linux-dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *rc* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            "${prerelease[@]}" \
            "win64-dist/EOS-EXIF-Join-${GITHUB_REF_NAME}-win64.exe" \
            "linux-dist/EOS-EXIF-Join-${GITHUB_REF_NAME}-linux"
